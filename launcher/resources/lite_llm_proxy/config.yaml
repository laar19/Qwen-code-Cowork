# =============================================================================
# GENERAL SETTINGS
# =============================================================================

litellm_settings:
  # Drop parameters that the target model doesn't support
  drop_params: true
  
  # Enable request/response caching
  # cache: true
  
  # Set default timeout (seconds)
  request_timeout: 120
  
  # Number of retries on failure
  num_retries: 2
  
  # Retry delay (seconds)
  retry_after: 1

# =============================================================================
# ROUTER SETTINGS (for load balancing)
# =============================================================================

# router_settings:
#   routing_strategy: least-busy  # Options: simple-shuffle, least-busy, latency-based-routing
#   model_group_alias:
#     gpt-4: load-balanced-chat  # Alias "gpt-4" requests to use load-balanced-chat

