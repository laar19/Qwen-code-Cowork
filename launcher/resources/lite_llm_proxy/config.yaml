# =============================================================================
# LiteLLM Advanced Configuration
# =============================================================================
# This is an advanced configuration file for LiteLLM proxy.
# Use this when you need:
#   - Multiple models behind a single endpoint
#   - Model aliasing (disguise one model as another)
#   - Load balancing between providers
#   - Rate limiting and retry logic
#
# Usage:
#   1. Copy this file to config.yaml
#   2. Set LITELLM_CONFIG_PATH=/path/to/config.yaml in .env
#   3. Or run: litellm --config config.yaml
# =============================================================================

# =============================================================================
# MODEL LIST
# =============================================================================
# Define all models you want to expose through the proxy.
# model_name: The name exposed to clients (what they'll request)
# litellm_params.model: The actual model to call

model_list:
  # -----------------------------------------------------------------------------
  # DeepSeek Models
  # -----------------------------------------------------------------------------
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-coder
    litellm_params:
      model: deepseek/deepseek-coder
      api_key: os.environ/DEEPSEEK_API_KEY

  # -----------------------------------------------------------------------------
  # Alias: Make DeepSeek respond to Anthropic model names
  # This tricks apps expecting Claude into using DeepSeek
  # -----------------------------------------------------------------------------
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: claude-3-sonnet-20240229
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

